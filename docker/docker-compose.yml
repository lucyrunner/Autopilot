version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - MODEL_DEVICE=cpu
    depends_on:
      - redis
    volumes:
      - ../models:/app/models:ro

volumes:
  redis-data:
